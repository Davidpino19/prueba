[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "micli"
version = "0.2.0"
description = "Mi primera CLI"
requires-python = ">=3.8"
dependencies = ["colorama", "httpx"]

[project.scripts]
micli = "micli.cli:main"

[tool.setuptools]
packages = ["micli"]
